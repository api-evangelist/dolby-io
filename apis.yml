apis:
- aid: dolby-io:dolby-io-media-api
  name: Dolby.io Media API
  tags:
  - Media Processing
  - Audio Enhancement
  - Noise Reduction
  - Music Mastering
  - Transcoding
  - Analyze
  humanURL: https://docs.dolby.io/media-apis/
  properties:
  - url: https://docs.dolby.io/media-apis/
    type: Documentation
  - url: https://www.postman.com/dolbyio/dolby-io-media-apis/overview
    type: Documentation
  description: >-
    Legacy Dolby.io Media APIs for cloud-based audio and video processing. Includes Enhance (noise reduction,
    leveling, dialog isolation), Analyze (loudness, speech metrics, diagnostics), Transcode (web/mobile
    output formats), Diagnose (audio quality reporting), and Music Mastering. Jobs are submitted with
    media URLs and polled or webhook-notified. Status monitored at status.dolby.io. Use of these APIs
    is migrating to the OptiView platform.
- aid: dolby-io:dolby-io-communications-api
  name: Dolby.io Communications API
  tags:
  - Communications
  - Conferencing
  - WebRTC
  - Voice
  - Video
  - Recording
  - Legacy
  humanURL: https://docs.dolby.io/communications-apis/
  properties:
  - url: https://docs.dolby.io/communications-apis/
    type: Documentation
  - url: https://docs.dolby.io/communications-apis/reference/introduction-to-streaming-api
    type: Documentation
  description: >-
    Legacy Communications APIs for high-quality WebRTC voice and video conferencing with spatial audio,
    music mode, noise suppression, and dial-in/dial-out. Includes Client Access Token, Conference, Recording,
    Monitor, Mixer Direct, Streaming (RTMP/HLS), and Webhooks services. Documentation now redirects to
    the OptiView portal; status.dolby.io still tracks these services. Generally superseded by the OptiView
    product line; existing customers should contact Dolby for migration guidance.
- aid: dolby-io:dolby-optiview-ads-api
  name: Dolby OptiView Ads API
  tags:
  - Advertising
  - Server-Guided Ad Insertion
  - SGAI
  - Live Streaming
  - Manifests
  tags_raw:
  - Advertising
  - Server-Guided Ad Insertion
  - SGAI
  - Live Streaming
  - Manifest
  humanURL: https://optiview.dolby.com/docs/ads/
  properties:
  - url: https://optiview.dolby.com/docs/ads/
    type: Documentation
  - url: https://optiview.dolby.com/docs/ad-engine/
    type: Documentation
  description: >-
    Server-Guided Ad Insertion (SGAI) for live streaming. The Signaling Service enriches origin manifests
    with advanced ad-break markers and integrates with Google Ad Manager for ad decisioning; the Ad Engine
    handles ad-format transformation; the OptiView Player fetches and replaces creatives client-side.
    Supports Full Screen, Double Box, and L-shape ad formats across web, mobile, and TV platforms.
- aid: dolby-io:dolby-optiview-player-sdk
  name: Dolby OptiView Player SDK (THEOplayer)
  tags:
  - Player
  - SDK
  - HLS
  - MPEG-DASH
  - DRM
  - Advertising
  humanURL: https://optiview.dolby.com/docs/theoplayer/
  properties:
  - url: https://optiview.dolby.com/docs/theoplayer/
    type: Documentation
  - url: https://optiview.dolby.com/docs/open-video-ui/
    type: Documentation
  description: >-
    Cross-platform video player (formerly THEOplayer) with SDKs for Web, Android, iOS & tvOS, React Native,
    Flutter, Chromecast, and Roku. Supports HLS, MPEG-DASH, DRM, advertising integration, low-latency
    WebRTC playback through the OptiView Real-time Streaming feed, and the Open Video UI component library
    for fully customizable player interfaces. Latest series 11.x; long history of releases back to 4.x.
