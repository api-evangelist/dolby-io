naftiko: 1.0.0-alpha2
info:
  label: Dolby OptiView Live (THEOlive) — Webhooks
  description: Subscribe to 30+ event types via webhook delivery on the Dolby OptiView Live (THEOlive) platform, with full delivery logs.
  tags:
  - Dolby
  - OptiView
  - THEOlive
  - Webhooks
  - Events
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    THEOLIVE_USER: THEOLIVE_USER
    THEOLIVE_PASSWORD: THEOLIVE_PASSWORD
capability:
  consumes:
  - type: http
    namespace: theolive-webhooks
    baseUri: https://api.theo.live/v2
    description: Webhook management on the OptiView Live (THEOlive) REST API.
    resources:
    - name: webhooks
      path: /webhooks
      operations:
      - name: listWebhooks
        method: GET
      - name: createWebhook
        method: POST
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
      - name: getWebhook
        method: GET
        path: /webhooks/{webhookID}
        inputParameters:
        - name: webhookID
          in: path
          type: string
          required: true
      - name: deleteWebhook
        method: DELETE
        path: /webhooks/{webhookID}
        inputParameters:
        - name: webhookID
          in: path
          type: string
          required: true
    authentication:
      type: basic
      key: Authorization
      value: 'Basic {{env.THEOLIVE_USER}}:{{env.THEOLIVE_PASSWORD}}'
      placement: header
  exposes:
  - type: mcp
    namespace: theolive-webhooks-mcp
    port: 9090
    transport: http
    description: MCP adapter for OptiView Live webhook management.
    tools:
    - name: theolive-create-webhook
      description: Register a webhook for OptiView Live events.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: theolive-webhooks.createWebhook
      with:
        body: tools.body
