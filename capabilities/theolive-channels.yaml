naftiko: 1.0.0-alpha2
info:
  label: Dolby OptiView Live (THEOlive) — Channels
  description: Create, list, retrieve, update, delete, start, and stop live streaming channels on the Dolby OptiView Live (THEOlive) platform.
  tags:
  - Dolby
  - OptiView
  - THEOlive
  - Live Streaming
  - Channels
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    THEOLIVE_USER: THEOLIVE_USER
    THEOLIVE_PASSWORD: THEOLIVE_PASSWORD
capability:
  consumes:
  - type: http
    namespace: channels
    baseUri: https://api.theo.live/v2
    description: Channel management on the OptiView Live (THEOlive) REST API.
    resources:
    - name: channels
      path: /channels
      operations:
      - name: listChannels
        method: GET
        description: List live channels.
      - name: createChannel
        method: POST
        description: Create a new live channel.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
      - name: getChannel
        method: GET
        path: /channels/{channelID}
        description: Retrieve a channel by ID.
        inputParameters:
        - name: channelID
          in: path
          type: string
          required: true
      - name: updateChannel
        method: PUT
        path: /channels/{channelID}
        description: Update a channel.
        inputParameters:
        - name: channelID
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
      - name: deleteChannel
        method: DELETE
        path: /channels/{channelID}
        description: Delete a channel.
        inputParameters:
        - name: channelID
          in: path
          type: string
          required: true
      - name: startChannel
        method: POST
        path: /channels/{channelID}/start
        description: Start streaming on the channel.
        inputParameters:
        - name: channelID
          in: path
          type: string
          required: true
      - name: stopChannel
        method: POST
        path: /channels/{channelID}/stop
        description: Stop streaming on the channel.
        inputParameters:
        - name: channelID
          in: path
          type: string
          required: true
    authentication:
      type: basic
      key: Authorization
      value: 'Basic {{env.THEOLIVE_USER}}:{{env.THEOLIVE_PASSWORD}}'
      placement: header
  exposes:
  - type: mcp
    namespace: channels-mcp
    port: 9090
    transport: http
    description: MCP adapter for OptiView Live channel management.
    tools:
    - name: theolive-create-channel
      description: Create a live streaming channel.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: channels.createChannel
      with:
        body: tools.body
    - name: theolive-start-channel
      description: Start a live channel.
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: channels.startChannel
      with:
        channelID: tools.channelID
    - name: theolive-stop-channel
      description: Stop a live channel.
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: channels.stopChannel
      with:
        channelID: tools.channelID
