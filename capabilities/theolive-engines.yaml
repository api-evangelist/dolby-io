naftiko: 1.0.0-alpha2
info:
  label: Dolby OptiView Live (THEOlive) — Engines
  description: Manage transcoding engines (quality profiles, DRM, overlays, output formats) on the Dolby OptiView Live (THEOlive) platform.
  tags:
  - Dolby
  - OptiView
  - THEOlive
  - Transcoding
  - Engines
  - DRM
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    THEOLIVE_USER: THEOLIVE_USER
    THEOLIVE_PASSWORD: THEOLIVE_PASSWORD
capability:
  consumes:
  - type: http
    namespace: engines
    baseUri: https://api.theo.live/v2
    description: Engine management on the OptiView Live (THEOlive) REST API.
    resources:
    - name: engines
      path: /engines
      operations:
      - name: listEngines
        method: GET
      - name: createEngine
        method: POST
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
      - name: getEngine
        method: GET
        path: /engines/{engineID}
        inputParameters:
        - name: engineID
          in: path
          type: string
          required: true
      - name: updateEngine
        method: PUT
        path: /engines/{engineID}
        inputParameters:
        - name: engineID
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
      - name: deleteEngine
        method: DELETE
        path: /engines/{engineID}
        inputParameters:
        - name: engineID
          in: path
          type: string
          required: true
      - name: startEngine
        method: POST
        path: /engines/{engineID}/start
        inputParameters:
        - name: engineID
          in: path
          type: string
          required: true
      - name: stopEngine
        method: POST
        path: /engines/{engineID}/stop
        inputParameters:
        - name: engineID
          in: path
          type: string
          required: true
    authentication:
      type: basic
      key: Authorization
      value: 'Basic {{env.THEOLIVE_USER}}:{{env.THEOLIVE_PASSWORD}}'
      placement: header
  exposes:
  - type: mcp
    namespace: engines-mcp
    port: 9090
    transport: http
    description: MCP adapter for OptiView Live engine management.
    tools:
    - name: theolive-create-engine
      description: Create a transcoding engine.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: engines.createEngine
      with:
        body: tools.body
