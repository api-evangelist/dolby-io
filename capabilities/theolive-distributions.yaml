naftiko: 1.0.0-alpha2
info:
  label: Dolby OptiView Live (THEOlive) — Distributions
  description: Manage stream-delivery endpoints with security controls (geo-blocking, IP blocking, referer restrictions) and WebRTC delivery on the Dolby OptiView Live (THEOlive) platform.
  tags:
  - Dolby
  - OptiView
  - THEOlive
  - Distributions
  - Security
  - Geo Blocking
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    THEOLIVE_USER: THEOLIVE_USER
    THEOLIVE_PASSWORD: THEOLIVE_PASSWORD
capability:
  consumes:
  - type: http
    namespace: distributions
    baseUri: https://api.theo.live/v2
    description: Distribution management on the OptiView Live (THEOlive) REST API.
    resources:
    - name: distributions
      path: /distributions
      operations:
      - name: listDistributions
        method: GET
      - name: createDistribution
        method: POST
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
      - name: getDistribution
        method: GET
        path: /distributions/{distributionID}
        inputParameters:
        - name: distributionID
          in: path
          type: string
          required: true
      - name: updateDistribution
        method: PUT
        path: /distributions/{distributionID}
        inputParameters:
        - name: distributionID
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
      - name: deleteDistribution
        method: DELETE
        path: /distributions/{distributionID}
        inputParameters:
        - name: distributionID
          in: path
          type: string
          required: true
    authentication:
      type: basic
      key: Authorization
      value: 'Basic {{env.THEOLIVE_USER}}:{{env.THEOLIVE_PASSWORD}}'
      placement: header
  exposes:
  - type: mcp
    namespace: distributions-mcp
    port: 9090
    transport: http
    description: MCP adapter for OptiView Live distribution management.
    tools:
    - name: theolive-create-distribution
      description: Create a stream distribution endpoint with security controls.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: distributions.createDistribution
      with:
        body: tools.body
