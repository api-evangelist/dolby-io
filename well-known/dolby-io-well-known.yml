generated: '2026-06-20'
method: searched
source: live probes of /.well-known/* across the Dolby OptiView / Dolby.io hosts
notes: >-
  Only dolby.com publishes a genuine /.well-known/security.txt (saved as
  dolby-io-security.txt, RFC 9116). The docs.dolby.io and dolby.io hosts return
  HTTP 200 for every /.well-known/* path but the body is the site's HTML shell
  (Docusaurus / WordPress soft-200), not a real discovery document, so no raw
  files were saved for them. api.millicast.com returns 403 (WAF); api.theo.live
  returns 404.
hosts:
