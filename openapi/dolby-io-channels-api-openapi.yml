          description: End date for the analytics period
        required: true
        description: End date for the analytics period
        name: end
        in: query
      - schema:
          type: string
          enum:
          - engine
          - channel
          description: Group results by engine or channel
        required: false
        description: Group results by engine or channel
        name: groupBy
        in: query
      - schema:
          type: string
          enum:
          - 15min
          - hour
          - day
          - month
          description: Time resolution for the analytics data
        required: true
        description: Time resolution for the analytics data
        name: resolution
        in: query
      - schema:
          type: string
          description: Comma-separated list of engine IDs to filter by
        required: false
        description: Comma-separated list of engine IDs to filter by
        name: engineIds
        in: query
      - schema:
