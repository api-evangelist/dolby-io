components:
  schemas:
    DistributionObjectResult:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/Distribution'
          - description: Distribution object
      required:
      - data
    ChannelCreated:
      allOf:
      - $ref: '#/components/schemas/Channel'
      - type: object
        properties:
          ingests:
            type: array
            items:
              $ref: '#/components/schemas/Ingest'
            description: Connected ingests
          engines:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: Unique identifier of the engine
                name:
                  type: string
                  description: Name of the engine
                createdAt:
                  type: string
                  description: Creation timestamp
                updatedAt:
                  type: string
                  description: Last update timestamp
                quality:
                  type: object
                  properties:
                    abrLadderId:
                      type: string
                      description: ABR ladder ID
                  required:
                  - abrLadderId
                  description: Quality configuration
                overlays:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        description: URL of the overlay image
                      position:
                        type: object
                        properties:
                          top:
                            type: integer
                            minimum: 0
                            description: Pixels from top
                          bottom:
                            type: integer
                            minimum: 0
                            description: Pixels from bottom (ignored if top is present)
                          left:
                            type: integer
                            minimum: 0
                            description: Pixels from left
                          right:
                            type: integer
                            minimum: 0
                            description: Pixels from right (ignored if left is present)
                        description: Overlay position
                      size:
                        type: object
                        properties:
                          width:
                            type: integer
                            minimum: 0
                            description: Width in pixels
                          height:
                            type: integer
                            minimum: 0
                            description: Height in pixels
                        description: Overlay size
                      opacity:
                        type: number
                        minimum: 0
                        maximum: 1
                        description: Overlay opacity (0=invisible, 1=fully visible)
                    required:
                    - url
                  description: Image overlay configuration
                drm:
                  type: boolean
                  description: Whether DRM is enabled
                priority:
                  type: number
                  description: Engine priority
                status:
                  type: string
                  enum:
                  - stopped
                  - deploying
                  - starting
                  - waiting
                  - ingesting
                  - playing
                  - stopping
                  - error
                  - deleting
                  - deleted
                  description: Current status of the engine
                daiAssetKey:
                  type: string
                  nullable: true
                  description: DAI asset key
                outputs:
                  type: object
                  properties:
                    hesp:
                      type: boolean
                      default: true
                      description: Enable HESP output. Enabled by default.
                    hls:
                      type: boolean
                      default: true
                      description: Enable HLS output. Enabled by default.
                    hlsMpegTs:
                      type: boolean
                      default: false
                      description: Enable HLS MPEG-TS output. Only available when enabled on organization level.
                  description: Output format configuration
              required:
              - id
              - name
              - createdAt
              - updatedAt
              - quality
              - overlays
              - drm
              - priority
              - status
              - outputs
            description: Connected engines
          distributions:
            type: array
            items:
              $ref: '#/components/schemas/Distribution'
            description: Connected distributions
        required:
        - ingests
        - engines
        - distributions
      description: Created channel with connected resources
    CustomEndpointObjectResult:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CustomEndpoint'
      required:
      - data
    EngineObjectResult:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              description: Unique identifier of the engine
            name:
              type: string
              description: Name of the engine
            createdAt:
              type: string
              description: Creation timestamp
            updatedAt:
              type: string
              description: Last update timestamp
            quality:
              type: object
              properties:
                abrLadderId:
                  type: string
                  description: ABR ladder ID
              required:
              - abrLadderId
              description: Quality configuration
            overlays:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: URL of the overlay image
                  position:
                    type: object
                    properties:
                      top:
                        type: integer
                        minimum: 0
                        description: Pixels from top
                      bottom:
                        type: integer
                        minimum: 0
                        description: Pixels from bottom (ignored if top is present)
                      left:
                        type: integer
                        minimum: 0
                        description: Pixels from left
                      right:
                        type: integer
                        minimum: 0
                        description: Pixels from right (ignored if left is present)
                    description: Overlay position
                  size:
                    type: object
                    properties:
                      width:
                        type: integer
                        minimum: 0
                        description: Width in pixels
                      height:
                        type: integer
                        minimum: 0
                        description: Height in pixels
                    description: Overlay size
                  opacity:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: Overlay opacity (0=invisible, 1=fully visible)
                required:
                - url
              description: Image overlay configuration
            drm:
              type: boolean
              description: Whether DRM is enabled
            priority:
              type: number
              description: Engine priority
            status:
              type: string
              enum:
              - stopped
              - deploying
              - starting
              - waiting
              - ingesting
              - playing
              - stopping
              - error
              - deleting
              - deleted
              description: Current status of the engine
            daiAssetKey:
              type: string
              nullable: true
              description: DAI asset key
            outputs:
              type: object
              properties:
                hesp:
                  type: boolean
                  default: true
                  description: Enable HESP output. Enabled by default.
                hls:
                  type: boolean
                  default: true
                  description: Enable HLS output. Enabled by default.
                hlsMpegTs:
                  type: boolean
                  default: false
                  description: Enable HLS MPEG-TS output. Only available when enabled on organization level.
              description: Output format configuration
          required:
          - id
          - name
          - createdAt
          - updatedAt
          - quality
          - overlays
          - drm
          - priority
          - status
          - outputs
          description: Engine object
      required:
      - data
    PaginatedChannelResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
          description: List of channels
        pagination:
          type: object
          properties:
            hasMore:
              type: boolean
              description: Whether more results are available
            cursor:
              type: string
              description: Cursor for the next page of results
          required:
          - hasMore
          - cursor
          description: Pagination info
      required:
      - data
      - pagination
    CountryInsightsListResult:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              city:
                type: string
                description: City name
              countryCode:
                type: string
                description: ISO country code
              geoLocation:
                type: string
                description: Rounded latitude,longitude
              amount:
                type: number
                description: Number of unique viewers
            required:
            - city
            - countryCode
            - geoLocation
            - amount
          description: List of country insights
      required:
      - data
    CreateCustomEndpointBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the custom endpoint
        src:
          type: string
          minLength: 1
          description: Source URL
        srcType:
          type: string
          enum:
          - hesp
          - hls
          - dash
          description: Source type (hesp, hls or dash)
        provider:
          type: string
          minLength: 1
          description: Provider name (must be configured for the organization)
        drmConfig:
          $ref: '#/components/schemas/CustomEndpointDrmConfig'
        cdn:
          type: string
          minLength: 1
          pattern: ^[a-zA-Z0-9]+$
          description: CDN identifier
        priority:
          type: integer
          description: Priority (lower is higher priority)
      required:
      - name
      - src
      - srcType
      - provider
      - cdn
      - priority
      additionalProperties: false
    Ingest:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the ingest
        name:
          type: string
          description: Name of the ingest
        createdAt:
          type: string
          description: Creation timestamp
        type:
          type: string
          enum:
          - rtmp-push
          - rtmp-pull
          - srt-pull
          - srt-push
          - sdi-pull
          description: Ingest type
        url:
          type: string
          description: Ingest URL
        streamKey:
          type: string
          description: Stream key for RTMP push ingests
        tracks:
          type: object
          properties:
            audio:
              type: array
              items:
                type: object
                properties:
                  pid:
                    type: number
                    description: Audio track PID (mandatory for multi-audio)
                  language:
                    type: string
                    description: Audio track language code
                  label:
                    type: string
                    description: Audio track label
                required:
                - language
                - label
              description: Audio track configuration
          description: Audio track configuration
        captions:
          type: array
          items:
            type: object
            properties:
              channel:
                type: number
                description: Caption channel number
              language:
                type: string
                description: Caption language code
              label:
                type: string
                description: Caption label
            required:
            - channel
            - language
          description: Caption configuration
      required:
      - id
      - name
      - createdAt
      - type
      - url
      - streamKey
      - tracks
      - captions
    PaginatedDistributionResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Distribution'
          description: List of distributions
        pagination:
          type: object
          properties:
            hasMore:
              type: boolean
              description: Whether more results are available
            cursor:
              type: string
              description: Cursor for the next page of results
          required:
          - hasMore
          - cursor
          description: Pagination info
      required:
      - data
      - pagination
    UpdateChannelBody:
      type: object
      properties:
        name:
          type: string
          description: Name of the channel
        externalId:
          type: string
          description: External identifier for the channel
        timeout:
          type: number
          minimum: 0
          description: Timeout in seconds (minimum 60). To never stop, pass 0
        ads:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether ads are enabled
            settings:
              type: object
              properties:
                assetKey:
                  type: string
                  description: DAI asset key
                layout:
                  type: string
                  enum:
                  - SINGLE
                  - DOUBLE
                  - LSHAPE_AD
                  - LSHAPE_CONTENT
                  description: Ad layout type
                enableBumperAds:
                  type: boolean
                  description: Whether bumper ads are enabled
                podDuration:
                  type: number
                  description: Pod duration in seconds
                customAdTagParameters:
                  type: object
                  additionalProperties:
                    type: string
                  description: Custom ad tag parameters
              required:
              - assetKey
              - layout
              description: Ad settings (required when enabled is true)
          required:
          - enabled
          description: Ads configuration. Only available when ads feature is enabled on organization level.
        dvr:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether DVR is enabled
            windowInSeconds:
              type: number
              minimum: 60
              maximum: 86400
              description: DVR window in seconds (60-86400)
          required:
          - enabled
          description: DVR configuration. Only available when DVR feature is enabled on organization level.
        nielsen:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether Nielsen is enabled
          required:
          - enabled
          description: Nielsen configuration. Only available when Nielsen feature is enabled on organization level.
        instreamMetadata:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether instream metadata is enabled
            uuids:
              type: array
              items:
                type: string
                format: uuid
              description: Array of instream metadata UUIDs
          required:
          - enabled
          description: Instream metadata configuration
      additionalProperties: false
    ChannelObjectResult:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/Channel'
          - description: Channel object
      required:
      - data
    PaginatedEngineRunResult:
      type: object
      properties:
        data:
          type: array
          items:
