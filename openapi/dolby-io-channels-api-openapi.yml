          - error
          - deleting
          - deleted
          description: Current status of the channel
        externalId:
          type: string
          description: External identifier
        timeout:
          type: number
          description: Timeout in seconds
        ads:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether ads are enabled
            settings:
              type: object
              properties:
                assetKey:
                  type: string
                  description: DAI asset key
                layout:
                  type: string
                  enum:
                  - SINGLE
                  - DOUBLE
                  - LSHAPE_AD
                  - LSHAPE_CONTENT
                  description: Ad layout type
                enableBumperAds:
                  type: boolean
                  description: Whether bumper ads are enabled
                podDuration:
                  type: number
                  description: Pod duration in seconds
                customAdTagParameters:
                  type: object
                  additionalProperties:
                    type: string
                  description: Custom ad tag parameters
              required:
              - assetKey
              - layout
              description: Ad settings (required when enabled is true)
          required:
          - enabled
          description: Ads configuration
        dvr:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether DVR is enabled
            windowInSeconds:
              type: number
              minimum: 60
              maximum: 86400
              description: DVR window in seconds (60-86400)
          required:
          - enabled
          description: DVR configuration
        nielsen:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether Nielsen is enabled
          required:
          - enabled
          description: Nielsen configuration
        instreamMetadata:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether instream metadata is enabled
            uuids:
              type: array
              items:
                type: string
                format: uuid
              description: Array of instream metadata UUIDs
          required:
          - enabled
          description: Instream metadata configuration
        perpetual:
          type: boolean
          description: Whether this channel is 24/7 (never times out, excluded from transcoding analytics)
        organizationId:
          type: string
          description: Organization ID
      required:
      - id
      - createdAt
      - name
      - status
      - timeout
      - perpetual
      - organizationId
    PaginatedEngineResult:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the engine
              name:
                type: string
                description: Name of the engine
              createdAt:
                type: string
                description: Creation timestamp
              updatedAt:
                type: string
                description: Last update timestamp
              quality:
                type: object
                properties:
                  abrLadderId:
                    type: string
                    description: ABR ladder ID
                required:
                - abrLadderId
                description: Quality configuration
              overlays:
                type: array
                items:
                  type: object
                  properties:
                    url:
                      type: string
                      description: URL of the overlay image
                    position:
                      type: object
                      properties:
                        top:
                          type: integer
                          minimum: 0
                          description: Pixels from top
                        bottom:
                          type: integer
                          minimum: 0
                          description: Pixels from bottom (ignored if top is present)
                        left:
                          type: integer
                          minimum: 0
                          description: Pixels from left
                        right:
                          type: integer
                          minimum: 0
                          description: Pixels from right (ignored if left is present)
                      description: Overlay position
                    size:
                      type: object
                      properties:
                        width:
                          type: integer
                          minimum: 0
                          description: Width in pixels
                        height:
                          type: integer
                          minimum: 0
                          description: Height in pixels
                      description: Overlay size
                    opacity:
                      type: number
                      minimum: 0
                      maximum: 1
                      description: Overlay opacity (0=invisible, 1=fully visible)
                  required:
                  - url
                description: Image overlay configuration
              drm:
                type: boolean
                description: Whether DRM is enabled
              priority:
                type: number
                description: Engine priority
              status:
                type: string
                enum:
                - stopped
                - deploying
                - starting
                - waiting
                - ingesting
                - playing
                - stopping
                - error
                - deleting
                - deleted
                description: Current status of the engine
              daiAssetKey:
                type: string
                nullable: true
                description: DAI asset key
              outputs:
                type: object
                properties:
                  hesp:
                    type: boolean
                    default: true
                    description: Enable HESP output. Enabled by default.
                  hls:
                    type: boolean
                    default: true
                    description: Enable HLS output. Enabled by default.
                  hlsMpegTs:
                    type: boolean
                    default: false
                    description: Enable HLS MPEG-TS output. Only available when enabled on organization level.
                description: Output format configuration
            required:
            - id
            - name
            - createdAt
            - updatedAt
            - quality
            - overlays
            - drm
            - priority
            - status
            - outputs
          description: List of engines
        pagination:
          type: object
          properties:
            hasMore:
              type: boolean
              description: Whether more results are available
            cursor:
              type: string
              description: Cursor for the next page of results
          required:
          - hasMore
          - cursor
          description: Pagination info
      required:
      - data
      - pagination
    CustomEndpointListResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomEndpoint'
          description: List of custom endpoints
      required:
      - data
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Secret
