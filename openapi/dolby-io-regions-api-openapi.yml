openapi: 3.2.0
info:
  title: Dolby OptiView THEOlive Regions API
  version: v2
  description: REST API for managing OptiView Live (THEOlive) channels, ingests, engines, distributions, analytics, and webhooks.
servers:
- url: https://api.theo.live/v2
  description: V2 API
- url: https://api.theo.live
  description: Base (for /v1 endpoints)
security:
- BasicAuth: []
tags:
- name: Regions
paths:
  /regions:
    get:
      tags:
      - Regions
      operationId: get-regions
      summary: Get all regions available for your organization
      responses:
        '200':
          description: List of regions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionListResult'
components:
  schemas:
    RegionListResult:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the region
              name:
                type: string
                description: Display name of the region
            required:
            - id
            - name
          description: List of regions
      required:
      - data
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
